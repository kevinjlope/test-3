# fly.toml app configuration file generated for fifty-flowers on 2026-05-10T09:20:49-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fifty-flowers'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[env]
  DATABASE_URL = "/app/data/products.db"
  HOST = "0.0.0.0"
  PORT = "3000"
  UPLOADS_PATH = "/app/data/uploads"

[[mounts]]
  source = "flower_data"
  destination = "/app/data"